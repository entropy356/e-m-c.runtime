[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emc-runtime"
version = "0.1.0"
description = "Light, single-process, modular agent experiment runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
emc-runtime = "emc_runtime.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["emc_runtime*"]

[tool.setuptools.package-data]
emc_runtime = ["py.typed"]
